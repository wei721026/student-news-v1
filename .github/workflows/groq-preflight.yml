name: Groq Provider Preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  groq-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Groq SDK
        run: pip install --upgrade groq

      - name: Validate Groq key, generation model, and live web search
        shell: bash
        run: |
          python - <<'PY'
          import os
          from groq import Groq

          raw = os.environ.get("GROQ_API_KEY", "")
          key = "".join(raw.strip().strip('`"\'').split())

          if not key:
              raise RuntimeError("GROQ_API_KEY is empty")

          if key != raw:
              print("INFO: GROQ_API_KEY whitespace/quote normalization applied")

          client = Groq(
              api_key=key,
              default_headers={"Groq-Model-Version": "latest"},
              max_retries=2,
              timeout=90.0,
          )

          # 1) Verify the actual generation model planned for Student News.
          generation = client.chat.completions.create(
              model="openai/gpt-oss-120b",
              messages=[
                  {
                      "role": "user",
                      "content": "Reply with one short sentence confirming that Groq generation works."
                  }
              ],
              reasoning_effort="low",
              include_reasoning=False,
              temperature=0.2,
              max_completion_tokens=256,
          )

          gen_text = (generation.choices[0].message.content or "").strip()
          if not gen_text:
              raise RuntimeError(
                  "Groq generation request succeeded but returned empty final content"
              )

          print("GROQ_GENERATION_PASS")
          print("GENERATION_SAMPLE:", gen_text[:300])

          # 2) Verify live web search through Compound.
          research = client.chat.completions.create(
              model="groq/compound",
              messages=[
                  {
                      "role": "user",
                      "content": (
                          "Use live web search now. Find the official Groq documentation "
                          "page for rate limits. Return the page title and URL."
                      ),
                  }
              ],
              compound_custom={
                  "tools": {
                      "enabled_tools": ["web_search"]
                  }
              },
          )

          msg = research.choices[0].message
          research_text = (msg.content or "").strip()
          executed_tools = getattr(msg, "executed_tools", None) or []

          if not research_text:
              raise RuntimeError("Groq Compound returned empty content")

          if not executed_tools:
              raise RuntimeError(
                  "Groq Compound responded but did not execute live web_search"
              )

          print("GROQ_WEB_SEARCH_PASS")
          print("WEB_SEARCH_SAMPLE:", research_text[:500])
          print("GROQ_PREFLIGHT_PASS")
          PY
