name: Groq Provider Preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  groq-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Groq SDK
        run: pip install --upgrade groq

      - name: Validate Groq key, generation model, and live web search
        shell: bash
        run: |
          python - <<'PY'
          import os
          from groq import Groq

          raw = os.environ.get("GROQ_API_KEY", "")
          # GitHub Secrets may accidentally contain a pasted trailing newline.
          # Groq API keys contain no whitespace, so normalize whitespace safely.
          key = "".join(raw.strip().strip('`"\'').split())

          if not key:
              raise RuntimeError("GROQ_API_KEY is empty")

          if key != raw:
              print("INFO: GROQ_API_KEY whitespace/quote normalization applied")

          client = Groq(
              api_key=key,
              max_retries=2,
              timeout=90.0,
          )

          # 1) Cheap generation smoke test.
          generation = client.chat.completions.create(
              model="openai/gpt-oss-20b",
              messages=[
                  {"role": "user", "content": "Reply with exactly: PASS"}
              ],
              temperature=0.1,
              max_completion_tokens=16,
          )
          text = (generation.choices[0].message.content or "").strip()
          if "PASS" not in text.upper():
              raise RuntimeError(
                  "Generation model responded, but smoke test did not return PASS"
              )
          print("GROQ_GENERATION_PASS")

          # 2) Force Compound to use live web search.
          research = client.chat.completions.create(
              model="groq/compound",
              messages=[{
                  "role": "user",
                  "content": (
                      "Use web search to find Groq's official documentation homepage. "
                      "Return the page title and absolute URL."
                  ),
              }],
              compound_custom={
                  "tools": {
                      "enabled_tools": ["web_search"]
                  }
              },
              temperature=0.1,
              max_completion_tokens=256,
          )

          message = research.choices[0].message
          body = (message.content or "").strip()
          tools = getattr(message, "executed_tools", None) or []

          if not tools:
              raise RuntimeError("Compound returned a response but did not execute web_search")
          if "http" not in body.lower():
              raise RuntimeError("Compound web-search response did not contain an absolute URL")

          print("GROQ_WEB_SEARCH_PASS")
          print("GROQ_PREFLIGHT_PASS")
          print(body)
          PY
